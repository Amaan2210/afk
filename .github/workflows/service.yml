name: service

on:
  push:
    branches: [main]
    paths: ["service/**", "protocol/**", ".github/workflows/service.yml"]
  pull_request:
    paths: ["service/**", "protocol/**", ".github/workflows/service.yml"]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The committed JSON Schema must match what the zod schemas emit.
      - name: Protocol schema is up to date
        run: npm run protocol:emit && git diff --exit-code -- ../protocol
