name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", ".github/workflows/android.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Also validates the committed Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:ktlintCheck :app:testDebugUnitTest :app:assembleDebug
      # `uses:` steps ignore the run working-directory, so the path starts at the repo root.
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
