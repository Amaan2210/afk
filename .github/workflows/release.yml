name: release

# A tag `vX.Y.Z` publishes the afkdev npm package. The Android plan adds a job that builds the
# APK and attaches it to the GitHub Release for the same tag.
on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Quoted, or YAML reads a number. Not 24.15.0, whose libuv crashes vitest's workers.
          node-version: "22.23"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: service/package-lock.json
      # A tag that does not name the version being published is a mistake, not a release.
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
